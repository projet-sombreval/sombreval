<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sombreval — choix de l'univers</title>
<link rel="stylesheet" href="couleurs.css">
<link rel="stylesheet" href="choix-univers.css">
<link rel="stylesheet" href="../site/css/commun/typo.css">
<link rel="stylesheet" href="../site/css/commun/espacements.css">

<body>

<main class="ecran">
  <h1 class="titre">Choisis ton monde</h1>
  <p class="accroche">Choisis avec soin. Le destin ne connaît aucun chemin de retour.</p>

  <ul class="mondes">
    <li class="monde monde-sombreval">
      <img src="porte-gothique-steam.png" alt="La porte de Sombreval">
      <span class="phrase">Sombreval<br>La peste remonte la vallée.</span>
      <button type="button">Entrer</button>
    </li>

    <li class="monde monde-salem">
      <img src="portail-gothique-aux.png" alt="La porte de Salem">
      <span class="phrase">Salem<br>Le village accuse, le tribunal écoute.</span>
      <button type="button">Entrer</button>
    </li>

    <li class="monde monde-serenissime">
      <img src="portail-gothique-aux-2.png" alt="La porte de Sérénissime">
      <span class="phrase">Sérénissime<br>Venise complote derrière ses masques.</span>
      <button type="button">Entrer</button>
    </li>
  </ul>

  <img class="brume-portes" src="image-1.png" alt="">
</main>

</body>
</html>
