<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sombreval — choix de l'univers</title>
<!-- Les couleurs D'ABORD : ce sont les variables que la feuille de
     l'écran consomme, et l'écran doit pouvoir les redéfinir pour lui.
     Dans l'autre sens, le bloc « .ecran » de couleurs.css écrasait
     celui de choix-univers.css — et l'écran perdait ses propres couleurs. -->
<link rel="stylesheet" href="couleurs.css">
<link rel="stylesheet" href="choix-univers.css">
<link rel="stylesheet" href="../site/css/commun/typo.css">
<link rel="stylesheet" href="../site/css/commun/espacements.css">
<link rel="stylesheet" href="../site/css/commun/boutons.css">
<link rel="stylesheet" href="../site/css/commun/champs.css">
<link rel="stylesheet" href="../site/css/commun/focus.css">
<link rel="stylesheet" href="../site/css/commun/mobile.css">
</head>
<body>

<main class="ecran">
    <h1 class="titre">Choisis ton monde</h1>
    <p class="accroche">Choisissez votre monde avec soin. Le destin ne connaît aucun chemin de retour.</p>

    <ul class="mondes">
      <li class="monde monde-sombreval">
        <img src="../site/images/porte-sombreval.png" alt="La porte de Sombreval">
        <span class="phrase">Bienvenue à Sombreval<br>La peste approche</span>
        <button type="button">Entrer</button>
      </li>

      <li class="monde monde-salem">
        <img src="../site/images/porte-salem.png" alt="La porte de Salem">
        <span class="phrase">Salem<br>Là où les corbeaux observent</span>
        <button type="button">Entrer</button>
      </li>

      <li class="monde monde-serenissime">
        <img src="../site/images/porte-serenissime.png" alt="La porte de Sérénissime">
        <span class="phrase">Sérénissime<br>Derrière le masque</span>
        <button type="button">Entrer</button>
      </li>
    </ul>
    <img class="brume-portes" src="../site/images/brume-portes.png" alt="">
  </main>

</body>
</html>
