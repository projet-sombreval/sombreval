<html lang="fr">
<head>

<title>Sombreval — choix de l'univers</title>
<link rel="stylesheet" href="choix-univers.css">
<link rel="stylesheet" href="couleurs.css">

<body>

<main class="ecran">
    <h1 class="titre">Choisis ton monde</h1>
    <p class="accroche">Choisissez votre monde avec soin. Le destin ne connaît aucun chemin de retour.</p>

    <ul class="mondes">
      <li class="monde monde-sombreval">
        <img src="porte-gothique-steam.png" alt="Porte Sombreval">
        <span class="phrase">Bienvenue à Sombreval 
          La peste approche</span>
        <button type="button">Entrer</button>
      </li>

      <li class="monde monde-salem">
        <img src="portail-gothique-aux.png" alt="Porte">
        <span class="phrase">Salem Salem là ou les corbeaux observent</span>
        <button type="button">Entrer</button>
      </li>

      <li class="monde monde-serenissime">
        <img src="portail-gothique-aux-2.png" alt="Porte ">
        <span class="phrase">Serenissime.Derrière le masque </span>
        <button type="button">Entrer</button>
      </li>
    </ul>
    <img class="brume-portes" src="image-1.png" alt="">
  </main>

</body>
