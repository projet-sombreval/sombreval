# Salem, 1692. Univers annoncé mais pas encore écrit : « disponible: false »
# suffit pour que l'écran de choix l'affiche en « bientôt » et refuse de
# lancer une partie.
#
# Pour l'ouvrir, il faudra recopier la structure de sombreval.yaml et rien
# d'autre : le moteur ne change pas.

nom: salem
disponible: true

titre: Salem
annee: 1692
sous_titre: Le village accuse, le tribunal écoute.
# ── À TOI ─────────────────────────────────────────────
# 1. La présentation de ton monde : deux ou trois phrases,
#    reprises du carnet d'univers rendu le 19 octobre.
# 2. Les sept couleurs, recopiées de D1. Les sept NOMS
#    sont imposés : tu ne changes que les valeurs.
# 3. Quand les deux sont faits : disponible: true
#
# Tant qu'une clé manque, le jeu la remplace par une valeur
# d'attente et l'écran l'affiche en « à écrire ». Ton monde
# n'attend donc pas d'être fini pour être montré.
# ──────────────────────────────────────────────────────

presentation: Salem, 1692.

couleurs:
  fond: "#1b1a16"
  parchemin: "#ece3cf"
  encre: #2a2119
  encre-pale: "#6b5f4f"
  accent: "#3d5a40"
  accent-clair: "#6b8f6e"
  bordure: "#b9a279"
