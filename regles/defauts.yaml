    pouvoir: "ici, le pouvoir de la menace, en une phrase"
    instruction_nuit: "ici, ce que fait la menace la nuit"
  espion:
    nom: "ici, le nom du rôle de l'espion"
    pouvoir: "ici, le pouvoir de l'espion, en une phrase"
    instruction_nuit: "ici, ce que fait l'espion la nuit"
  traitre:
    nom: "ici, le nom du rôle du traître"
    pouvoir: "ici, le pouvoir du traître, en une phrase"
    instruction_nuit: "ici, ce que fait le traître la nuit"
  enqueteur:
    nom: "ici, le nom du rôle de l'enquêteur"
    pouvoir: "ici, le pouvoir de l'enquêteur, en une phrase"
    instruction_nuit: "ici, ce que fait l'enquêteur la nuit"
  temoin:
    nom: "ici, le nom du rôle du témoin"
    pouvoir: "ici, le pouvoir du témoin, en une phrase"
    instruction_nuit: "ici, ce que fait le témoin la nuit"
  protecteur:
    nom: "ici, le nom du rôle du protecteur"
    pouvoir: "ici, le pouvoir du protecteur, en une phrase"
    instruction_nuit: "ici, ce que fait le protecteur la nuit"
  guerisseur:
    nom: "ici, le nom du rôle du guérisseur"
    pouvoir: "ici, le pouvoir du guérisseur, en une phrase"
    instruction_nuit: "ici, ce que fait le guérisseur la nuit"
  justicier:
    nom: "ici, le nom du rôle du justicier"
    pouvoir: "ici, le pouvoir du justicier, en une phrase"
    instruction_nuit: "ici, ce que fait le justicier la nuit"
  doyen:
    nom: "ici, le nom du rôle du doyen"
    pouvoir: "ici, le pouvoir du doyen, en une phrase"
    instruction_nuit: "ici, ce que fait le doyen la nuit"
  villageois:
    nom: "ici, le nom du rôle du villageois"
    pouvoir: "ici, le pouvoir du villageois, en une phrase"
    instruction_nuit: "ici, ce que fait le villageois la nuit"

# Les dix-neuf textes. Chacun dit ce qu'on attend, et garde ses paramètres.
textes:
  attente_titre: "ici, le titre de la salle d'attente"
  attente_consigne: "ici, ce qu'on fait en attendant les autres joueurs"
  decouverte_titre: "ici, le titre de l'écran qui révèle ton rôle"
  decouverte_consigne: "ici, la consigne quand on découvre son rôle"
  nuit_titre: "ici, le titre de la nuit"
  nuit_sans_pouvoir: "ici, ce que vit la nuit un joueur sans pouvoir"
  nuit_choix_fait: "ici, la phrase une fois le choix de nuit fait"
  nuit_mort: "ici, ce que vit la nuit un joueur mort"
  jour_titre: "ici, le titre du jour"
  jour_consigne: "ici, la consigne du débat et du vote"
  jour_mort: "ici, ce que vit le jour un joueur mort"
  vote_en_cours: "ici, le nombre de voix : {nombre}"
  elimine_nuit: "ici, {pseudo} meurt la nuit ; c'était {role}"
  personne_eliminee_nuit: "ici, la phrase quand personne ne meurt la nuit"
  elimine_jour: "ici, le village juge {pseudo} ; c'était {role}"
  egalite_jour: "ici, la phrase quand le vote est à égalité"
  fin_titre: "ici, le titre de la fin de partie"
  nuit_numero: "ici, le nom de la nuit numéro {numero}"
  jour_numero: "ici, le nom du jour numéro {numero}"

# ⚠️ ONZE, ET CE NOMBRE EST PORTEUR — mesuré. Les joueurs factices remplissent
# les places libres avec un pseudonyme NON DÉJÀ PRIS : avec un seul, un seul
# arrive, le village plafonne à deux sur huit, et la partie refuse de démarrer
# sur un message qui accuse le village au lieu de ce fichier. Onze couvre la
# plus grande partie (douze joueurs, moins l'humain).
pseudos_factices:
  - Joueuse 1
  - Joueuse 2
  - Joueuse 3
  - Joueuse 4
  - Joueuse 5
  - Joueuse 6
  - Joueuse 7
  - Joueuse 8
  - Joueuse 9
  - Joueuse 10
  - Joueuse 11

# Non vide : le jour, le moteur tire une phrase au hasard dans cette liste.
messages:
  - "ici, une phrase que les joueurs peuvent dire"
