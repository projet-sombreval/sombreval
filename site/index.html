<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sombreval — rejoindre une partie</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>

  <main class="ecran">
    <header>
      <h1>Sombreval</h1>
      <p class="accroche">Le village dort. Quelqu'un ne dort pas.</p>
    </header>

    <!-- Écran d'accueil (exigence E2) : un pseudo, un code, rien d'autre.
         Le formulaire n'est pas encore branché sur le serveur. -->
    <form class="formulaire" method="post" action="/rejoindre">
      <p>
        <label for="pseudo">Ton pseudo</label>
        <input id="pseudo" name="pseudo" maxlength="20" required>
      </p>
      <p>
        <label for="code">Le code de la partie</label>
        <input id="code" name="code" maxlength="6" required>
      </p>
      <button type="submit">Rejoindre la partie</button>
    </form>

    <footer>
      <p>Option Projet Sombreval — travail en cours.</p>
    </footer>
  </main>

</body>
</html>
